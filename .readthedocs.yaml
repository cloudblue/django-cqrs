# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      - pip install poetry==2.5.1
      - poetry config virtualenvs.create false
    post_install:
      # Install the library and the docs group from poetry.lock into the build environment
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --only main,docs

mkdocs:
  configuration: mkdocs.yml
